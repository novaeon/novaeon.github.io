name: Update Delft timetable feeds

on:
  push:
    branches: [main]
    paths:
      - 'delft-calendar/filters.toml'
      - 'delft-calendar/split_calendar.py'
      - 'delft-calendar/requirements.txt'
      - 'delft-calendar/tests/**'
      - '.github/workflows/update-delft-calendar.yml'
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-delft-timetable
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: delft-calendar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: delft-calendar/requirements.txt
      - run: pip install -r requirements.txt
      - name: Test event routing and calendar preservation
        run: python -m unittest discover -s tests -v
      - name: Check source secret is configured
        id: source
        env:
          TIMETABLE_SOURCE_URL: ${{ secrets.TIMETABLE_SOURCE_URL }}
        run: |
          if [ -z "$TIMETABLE_SOURCE_URL" ]; then
            echo '::warning::TIMETABLE_SOURCE_URL is missing. Feeds are snapshots; automatic refresh is not configured.'
            echo 'Add the TIMETABLE_SOURCE_URL repository Actions secret to enable live updates.' >> "$GITHUB_STEP_SUMMARY"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh all four feeds
        if: steps.source.outputs.configured == 'true'
        env:
          TIMETABLE_SOURCE_URL: ${{ secrets.TIMETABLE_SOURCE_URL }}
        run: python split_calendar.py
      - name: Commit refreshed feeds together
        if: steps.source.outputs.configured == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/*.ics
          if git diff --cached --quiet; then
            echo 'Feeds unchanged.'
            exit 0
          fi
          git commit -m 'Refresh Delft timetable feeds'
          git pull --rebase origin main
          git push origin HEAD:main
