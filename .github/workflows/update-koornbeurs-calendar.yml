name: Update Koornbeurs calendar

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-koornbeurs-calendar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: koornbeurs-calendar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: koornbeurs-calendar/requirements.txt

      - name: Install parser dependency
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update calendar
        run: python scrape_calendar.py --output koornbeurs.ics

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- koornbeurs.ics; then
            echo "Calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koornbeurs.ics
          git commit -m "Update Koornbeurs calendar"
          git push
